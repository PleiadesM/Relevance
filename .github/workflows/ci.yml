name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["data/**"]
  pull_request:
    paths-ignore: ["data/**"]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "requirements-dev.txt"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python scripts/validate_config.py
      # The zero-secret build invariant (no secrets in env -> green build,
      # nothing encrypted) is pinned unconditionally by the make_repo-based
      # unit tests in tests/test_smoke_build.py, which build a synthetic
      # template-shaped repo. That is the binding guarantee.
      #
      # The step below additionally proves it against THIS repo's real config —
      # the promise every forker relies on — but only while the deployment is
      # still public. Once a fork legitimately sets visibility: "private",
      # build.py correctly exits 1 without a passphrase, so running it here
      # would turn a correct hard fail into a permanently red CI. Guarding
      # beats deleting: the public template keeps its real-config proof.
      # 零密钥构建由单元测试无条件保证；此步骤额外用真实配置验证，
      # 但仅在本部署仍为 public 时运行——私密部署缺少口令时理应构建失败。
      - name: Detect site visibility
        id: vis
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          print("value=" + json.load(open("config/site.json"))["visibility"])
          PY

      - name: Smoke build (zero secrets, public deployments only)
        if: steps.vis.outputs.value == 'public'
        run: python scripts/build.py --output-dir /tmp/nd-smoke --smoke

      - name: Smoke build (real config, encrypted)
        env:
          NEWSDASH_PASSPHRASE: "ci smoke passphrase only"
        run: python scripts/build.py --output-dir /tmp/nd-smoke-enc --smoke

  webcrypto:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Cross-language envelope proof
        run: node tests/test_crypto_webcrypto.mjs
      - name: i18n fallback parity
        run: node tests/test_i18n_fallback.mjs
      - name: ES module syntax check
        run: |
          set -e
          for f in assets/js/*.js assets/js/views/*.js; do
            node --check --input-type=module < "$f"
            echo "OK $f"
          done

  guards:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: No token-looking strings in config
        # examples/ intentionally contains PLACEHOLDER capability-URL shapes,
        # so only config/ and feeds/ are scanned here.
        run: |
          set -e
          if grep -rInE "(github_pat_|ghp_[A-Za-z0-9]{20,}|Bearer [A-Za-z0-9._-]{20,}|calendar\.google\.com/calendar/ical/[^\"]*private)" config/ feeds/ 2>/dev/null; then
            echo "::error::Credential-looking string committed under config/ or feeds/"
            exit 1
          fi
          echo "config clean"
